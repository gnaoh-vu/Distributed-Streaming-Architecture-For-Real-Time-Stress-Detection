<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link 
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
	rel="stylesheet" 
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
	crossorigin="anonymous"
    >
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
	#prediction-panel {
	    height: 400px;
	    overflow-y: auto;
	    white-space: nowrap;
	}
    </style>

    <script 
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
	integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
	crossorigin="anonymous">
    </script>
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center"> 
	    <div class="container my-4">
	<div class="row justify-content-center">
	    <div class="col-12 col-md-8 col-lg-9">

		<div class="row g-3">
		    <div class="col-12 col-lg-8">
			<div class="card shadow-sm border-0 rounded-3 overflow-hidden">
			    <div class="card-body pb-2 pt-5">
				<div id="signal-chart" style="width: 100%; max-width: 1000px; height: 400px;"></div>
			    </div>
			</div>
		    </div>

		    <div class="col-12 col-lg-4">
			<div class="card shadow-sm border-0 rounded-3 h-100">
			    <div class="card-header">Predicted labels</div>
			    <div id="prediction-panel" class="card-body font-monospace"></div>
			</div>
		    </div>
		</div>

		<div class="mt-3">
		    <button class="btn btn-outline-success get-btn">Get</button>
		    <button class="btn btn-outline-secondary play-btn">Play</button>
		    <button class="btn btn-outline-secondary seek-btn" data-step="-1" title="Back one second" aria-label="Back one second"><i class="bi bi-chevron-left"></i></button>
		    <button class="btn btn-outline-secondary seek-btn" data-step="1" title="Forward one second" aria-label="Forward one second"><i class="bi bi-chevron-right"></i></button>
		    <button class="btn btn-outline-primary seek-btn" data-step="-offset" title="Back one window offset" aria-label="Back one window offset"><i class="bi bi-skip-backward-fill"></i></button>
		    <button class="btn btn-outline-primary seek-btn" data-step="offset" title="Forward one window offset" aria-label="Forward one window offset"><i class="bi bi-skip-forward-fill"></i></button>
		</div>
	    </div>
	</div>
    </div>

    <script src="https://cdn.plot.ly/plotly-4.0.0.min.js" charset="utf-8"></script>
    <script> 
	const predictionPanel = document.querySelector('#prediction-panel')
	const signalChart = document.querySelector('#signal-chart');

	const getBtn = document.querySelector('.get-btn')
	const playBtn = document.querySelector('.play-btn')
	const seekBtns = document.querySelectorAll('.seek-btn')

	const WINDOW_SIZE = 60
	const VIEW_SIZE = 120
	const DELAY_TIME = 15
	const FREQ = 4
	const OVERLAP_RATIO = 0.5
	const WINDOW_OFFSET = (1 - OVERLAP_RATIO) * WINDOW_SIZE
	const TIMESTAMP_REGION_SIZE = 60 * 60

	var time = 0
	var viewTime = 0

	var data = null
	var timestampMarkers = null

	var isPlaying = false
	var player = null

	function updatePlot() {
	    if (data == null) return
		
	    viewTime = time - DELAY_TIME + 1
	    const windowStart = Math.min(time * FREQ, data.x.length - 1)
	    const windowEnd = Math.min(windowStart + WINDOW_SIZE * FREQ, data.x.length - 1)
	    const nextRect = drawRect(data.x[windowStart], data.x[windowEnd])

	    const viewXLeft = Math.min(Math.max(viewTime, 0) * FREQ, (data.x.length / FREQ - VIEW_SIZE) * FREQ)
	    const viewXRight = Math.min((Math.max(viewTime, 0) + VIEW_SIZE) * FREQ - 1, data.x.length - 1)

	    Plotly.relayout(signalChart, {
		xaxis: {
		    range: [
			time >= DELAY_TIME ? data.x[viewXLeft] : data.x[0],
			time >= DELAY_TIME ? data.x[viewXRight] : data.x[VIEW_SIZE * FREQ - 1]
		    ],
		    autorange: false
		},
		shapes: [...timestampMarkers.shapes, nextRect],
		annotations: timestampMarkers.annotations
	    })
	}

	function drawTimestampRegions(timestamps) {
	    var shapes = []
	    var annotations = []
	    timestamps.forEach(ts => {
		const leftBoundary = ts - TIMESTAMP_REGION_SIZE
		const rightBoundary = ts + TIMESTAMP_REGION_SIZE

		shapes.push(
		    {
			type: 'line',
			xref: 'x',
			x0: ts,
			x1: ts,
			yref: 'paper',
			y0: 0,
			y1: 1,
			line: { color: 'red', width: 2 }
		    },
		    {
			type: 'line',
			xref: 'x',
			x0: leftBoundary,
			x1: leftBoundary,
			yref: 'paper',
			y0: 0,
			y1: 1,
			line: { color: 'red', width: 2, dash: 'dash' }
		    },
		    {
			type: 'line',
			xref: 'x',
			x0: rightBoundary,
			x1: rightBoundary,
			yref: 'paper',
			y0: 0,
			y1: 1,
			line: { color: 'red', width: 2, dash: 'dash' }
		    }
		)

		annotations.push(
		    {
			x: leftBoundary,
			y: 0.9,
			xref: 'x',
			yref: 'paper',
			ax: ts,
			ay: 0.9,
			axref: 'x',
			ayref: 'paper',
			text: '1 hour',
			showarrow: true,
			arrowhead: 2,
			arrowcolor: 'red'
		    },
		    {
			x: rightBoundary,
			y: 0.9,
			xref: 'x',
			yref: 'paper',
			ax: ts,
			ay: 0.9,
			axref: 'x',
			ayref: 'paper',
			text: '1 hour',
			showarrow: true,
			arrowhead: 2,
			arrowcolor: 'red'
		    }
		)
	    })

	    return { shapes, annotations }
	}

	function drawRect(xStart, xEnd) {
	    return {
		type: 'rect',
		xref: 'x',
		yref: 'paper',
		x0: xStart,
		x1: xEnd,
		y0: 0,
		y1: 1,
		fillcolor: 'rgba(128, 128, 128, 0.15)',
		line: { color: 'blue', width: 2 }
	    }
	}

	getBtn.addEventListener('click', async () => {
	    const res = await fetch('http://localhost:3000/test', {
		method: 'POST',
		headers: {
		    'Content-Type': 'application/json'
		},
		body: JSON.stringify({
		    patient_path: undefined 
		})
	    })

	    data = await res.json()
	    timestampMarkers = drawTimestampRegions(data.timestamps.slice(1))

	    const plotData = [
		{ x: data.x, y: data.y }
	    ]

	    const ySlice = data.y.slice(0, 480)
	    const yMin = Math.min(...ySlice)
	    const yMax = Math.max(...ySlice)
	    const padding = (yMax - yMin) * 0.7

	    const plotLayout = {
		uirevision: 'signal',
		margin: { t: 0 },
		xaxis: {
		    range: [data.x[0], data.x[120*FREQ - 1]],
		    autorange: false
		},

		yaxis: {
		    range: [yMin, yMax + padding],
		    fixedrange: false
		},

		shapes: [
		    ...timestampMarkers.shapes,
		    drawRect(data.x[0], data.x[WINDOW_SIZE*FREQ])
		],
		annotations: timestampMarkers.annotations
	    }

	    Plotly.newPlot(signalChart, plotData, plotLayout);
	    time = 0
	    viewTime = 0
	})

	seekBtns.forEach(button => {
	    button.addEventListener('click', () => {
		if (data == null) return
		const step = button.dataset.step === 'offset'
		    ? WINDOW_OFFSET
		    : button.dataset.step === '-offset' ? -WINDOW_OFFSET : Number(button.dataset.step)
		time = Math.max(0, Math.min(time + step, data.x.length / FREQ - WINDOW_SIZE))
		updatePlot()
	    })
	})

	playBtn.addEventListener('click', () => {
	    isPlaying = !isPlaying
	    console.log(time)

	    if (data != null && isPlaying) {
		player = setInterval(async () => {
		    if (time % 30 == 0) {
			const startTime = time*FREQ
			const endTime = (time + WINDOW_SIZE)*FREQ
			const res = await fetch('http://localhost:3000/test-predict', {
			    method: 'POST',
			    headers: {
				'Content-Type': 'application/json'
			    },
			    body: JSON.stringify({
				'data': data.x.slice(startTime, endTime)
			    })
			})

			const result = await res.json()
			const label = result.label == 1 ? "Stressed" : "Not Stressed"
			predictionPanel.innerHTML += `[${time} : ${time+WINDOW_SIZE}]: ${label}\n`
		    }

		    time += 1
		    viewTime = time - DELAY_TIME + 1

		    if (time < data.x.length/FREQ - WINDOW_SIZE) { updatePlot() }
		    else { clearInterval(player) }
		}, 1000)
	    }

	    else {
		clearInterval(player)
	    }
	})
    </script>
</body>
</html>
