services:
  iot-1:
    build: .
    container_name: iot-1
    environment:
      - MQTT_HOST=emqx-broker
      - MQTT_PORT=1883
      - MQTTT_CLIENT_ID=iot-device-1
    networks:
      - project-network
    volumes:
      - ./iot-1/data:/data
      - ./iot-1/control:/control

