services:
  iot-1:
    build: .
    container_name: iot-1
    environment:
      - MQTT_HOST=core1.emqx.io
      - MQTT_PORT=1883
      - MQTT_CLIENT_ID=0
    networks:
      - project-network
    volumes:
      - ./main.py:/app/main.py
      - ./iot-1/data/Part 101C:/data
      - ./iot-1/control:/control

