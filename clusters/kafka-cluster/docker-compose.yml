services:
  kafka-1:
    image: apache/kafka:latest
    hostname: kafka-1
    user: root
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,ICLIENT:PLAINTEXT,OCLIENT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: ICLIENT://kafka-1:9092,OCLIENT://kafka-1:19092,CONTROLLER://kafka-1:9093,INTERNAL://kafka-1:9094
      KAFKA_ADVERTISED_LISTENERS: OCLIENT://localhost:19092,ICLIENT://kafka-1:9092,INTERNAL://kafka-1:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
    networks:
      - project-network
    volumes:
      - ./broker-1/data:/var/lib/kafka/data

  kafka-2:
    image: apache/kafka:latest
    hostname: kafka-2
    user: root
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,ICLIENT:PLAINTEXT,OCLIENT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: ICLIENT://kafka-2:9092,OCLIENT://kafka-2:29092,INTERNAL://kafka-2:9094
      KAFKA_ADVERTISED_LISTENERS: ICLIENT://kafka-2:9092,OCLIENT://localhost:29092,INTERNAL://kafka-2:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
    networks:
      - project-network
    volumes:
      - ./broker-2/data:/var/lib/kafka/data

  kafka-3:
    image: apache/kafka:latest
    hostname: kafka-3
    user: root
    ports:
      - "39092:39092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,ICLIENT:PLAINTEXT,OCLIENT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: ICLIENT://kafka-3:9092,OCLIENT://kafka-3:39092,INTERNAL://kafka-3:9094
      KAFKA_ADVERTISED_LISTENERS: ICLIENT://kafka-3:9092,OCLIENT://localhost:39092,INTERNAL://kafka-3:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
    networks:
      - project-network
    volumes:
      - ./broker-3/data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui
    ports:
      - "8080:8080"
    restart: always
    environment:
      KAFKA_CLUSTERS_0_NAME: "kraft-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9094,kafka-2:9094,kafka-3:9094
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - project-network

networks:
  project-network:
    external: true
