services:
  namenode:
    build: .
    user: root
    ports:
      - "9870:9870"
    environment:
      - ENSURE_NAMENODEDIR=/tmp/hadoop-root/dfs/name
    command: >
      bash -c "
        if [ ! -f /tmp/hadoop-root/dfs/name/current/VERSION ]; then
          hdfs namenode -format -force;
        fi &&
        hdfs namenode
      "
    volumes:
      - ./namenode/mount:/mount
      - ./namenode/data:/tmp/hadoop-root/dfs/name
      - ./hadoop-conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./hadoop-conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./hadoop-conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
    networks:
      - project-network

  datanode:
    image: apache/hadoop:3.5.0
    user: root
    volumes:
      - ./datanode/data:/tmp/hadoop-root/dfs/data
      - ./hadoop-conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./hadoop-conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
    depends_on:
      - namenode
    command: >
      bash -c "
        hdfs datanode
      "
    networks:
      - project-network

  resource-manager:
    image: apache/hadoop:3.5.0 
    ports:
      - "8088:8088"
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    command: >
      bash -c "yarn resourcemanager"
    volumes:
      - ./hadoop-conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./hadoop-conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
    networks:
      - project-network

  node-manager-1:
    build: .
    ports:
      - "8041:8042"
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    depends_on:
      - resource-manager
    command: >
      bash -c "yarn nodemanager"
    volumes:
      - ./hadoop-conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./hadoop-conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
    networks:
      - project-network

  node-manager-2:
    build: .
    ports:
      - "8042:8042"
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    depends_on:
      - resource-manager
    command: >
      bash -c "yarn nodemanager"
    volumes:
      - ./hadoop-conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./hadoop-conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
    networks:
      - project-network

  spark-client:
    image: apache/spark-py
    user: root
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - PYSPARK_PYTHON=./environment/bin/python
      - PATH=/opt/spark/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: tail -F anything
    volumes:
      - ./jobs:/jobs
      - ./hadoop-conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./hadoop-conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
    networks:
      - project-network

networks:
  project-network:
    external: true
