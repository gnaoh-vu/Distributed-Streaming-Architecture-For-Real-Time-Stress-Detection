<div class="main-panel monitoring">
    <div class="metric-cards">
	<div class="metric-card">
	    <span class="metric-label">EDA (Electrodermal Activity)</span>
	    <div class="metric-value" id="val-eda" style="color: var(--accent-blue);">0.00 µS</div>
	</div>
	<div class="metric-card">
	    <span class="metric-label">Inter-beat Interval</span>
	    <div class="metric-value" id="val-ibi" style="color: var(--accent-rose);">--</div>
	</div>
	<div class="metric-card">
	    <span class="metric-label">AI Prediction (Current Window)</span>
	    <div class="metric-value" id="val-stress" style="color: var(--text-sub);">Waiting for prediction</div>
	</div>
    </div>

    <div class="chart-card">
	<div class="chart-header">
	    <div>
		<h3>EDA Signal & Prediction Windows</h3>
		<span id="time-display">Live: 0s</span>
	    </div>
	</div>

	<div class="chart-container">
	    <div id="signalChart" aria-label="Real-time EDA signal chart"></div>
	</div>
    </div>
</div>
