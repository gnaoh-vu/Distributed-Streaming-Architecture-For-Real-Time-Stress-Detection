<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Stress Trend Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="/static/styles/style.css" rel="stylesheet">
</head>
<body>
    <header>
        <h2>IoT Stress Trend Analysis</h2>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>Database connected</span>
        </div>
    </header>

    <div class="dashboard-grid">
        <aside class="patient-list">
            <h3>Patients</h3>
            <label for="patient-selector">Select patient</label>
            <select id="patient-selector" disabled>
                <option value="">Loading patients...</option>
            </select>
            <div id="patient-list-items" aria-live="polite"></div>
        </aside>

        <main class="main-panel">
            <div class="metric-cards">
                <div class="metric-card">
                    <span class="metric-label">Selected patient</span>
                    <div class="metric-value" id="patient-value">--</div>
                </div>
                <div class="metric-card">
                    <span class="metric-label">Stress events</span>
                    <div class="metric-value" id="stress-count">0</div>
                </div>
                <div class="metric-card">
                    <span class="metric-label">Peak day</span>
                    <div class="metric-value" id="peak-day">--</div>
                </div>
            </div>

            <section class="chart-card">
                <div class="chart-header">
                    <div>
                        <h3>Stress patterns</h3>
                        <p class="chart-description" id="chart-description">Frequency by day of week</p>
                    </div>
                    <div class="tabs" role="tablist" aria-label="Trend charts">
                        <button class="tab active" id="histogram-tab" role="tab" aria-selected="true">Histogram</button>
                        <button class="tab" id="heatmap-tab" role="tab" aria-selected="false">Heatmap</button>
                    </div>
                </div>

                <div class="chart-container">
                    <div id="trendChart" role="img" aria-label="Patient stress trend chart"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="/static/sources/app.js"></script>
</body>
</html>
